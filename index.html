<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Pedidos</title>

  <style>
    :root{
      --brand-cyan:  #06AAC7;
      --brand-green: #0D6B49;
      --brand-red:   #EB0622;

      --bg:      #73B7DD;
      --bg2:     #C7EBFE;
      --text:    #050506;

      --shadow:  0 10px 24px rgba(0,0,0,0.10);
      --radius:  16px;
    }

    *{ box-sizing: border-box; }

    body{
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin:0;
      color: var(--text);
      padding: 20px;
      background:
        radial-gradient(circle at 50% 35%, var(--bg2) 0%, rgba(199,235,254,0.9) 24%, rgba(115,183,221,1) 68%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .container{ max-width: 1200px; margin: 0 auto; }

    .brand-header{
      display:flex;
      flex-direction: column;
      align-items:center;
      gap: 10px;
      margin-bottom: 18px;
    }

    /* ✅ LOGO MÁS GRANDE */
    .brand-header img{
      height: 120px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.12));
    }

    h1{
      margin: 0;
      text-align:center;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #0b4f6b;
    }

    .controls{
      display:flex;
      justify-content:center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0 20px;
    }

    input, select, button{
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08);
      font-size: 16px;
      outline: none;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }

    .main-content{
      display:flex;
      gap: 18px;
      align-items: flex-start;
    }

    .inventory-section{ flex: 1; min-width: 0; }

    .card{
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header{
      padding: 14px 16px;
      font-weight: 800;
      color: #0b4f6b;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display:flex;
      align-items:center;
      gap: 8px;
    }

    table{ width: 100%; border-collapse: collapse; background: transparent; }

    th, td{
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      vertical-align: middle;
    }

    th{
      background: rgba(6,170,199,0.12);
      color: #0b4f6b;
      font-weight: 800;
    }

    tr:hover{ background-color: rgba(6,170,199,0.08); }

    .qty-input{
      width: 78px;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: none;
      background: rgba(255,255,255,0.95);
    }

    button{
      background-color: var(--brand-cyan);
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.05s ease, filter 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,0.10);
    }
    button:hover{ filter: brightness(0.94); }
    button:active{ transform: translateY(1px); }
    button:disabled{ opacity: 0.55; cursor: not-allowed; box-shadow: none; }

    /* ✅ panel derecho del tamaño justo (sin scroll horizontal) */
    #pedido-container{
      flex: 0 0 480px;
      position: sticky;
      top: 20px;
      min-width: 0;
    }

    .controls-pedido{ padding: 14px 16px 0; }
    .controls-pedido input, .controls-pedido select{
      width: 100%;
      background: rgba(255,255,255,0.95);
      box-shadow: none;
    }

    /* ✅ Tabla del pedido: no se desborda */
    #pedidoTable{
      width: 100%;
      table-layout: fixed;
      margin: 14px 0 0;
    }

    #pedidoTable th, #pedidoTable td{
      overflow: hidden;
      text-overflow: ellipsis;
      word-wrap: break-word;
    }

    #pedidoTable th:nth-child(1), #pedidoTable td:nth-child(1){ width: 52%; }
    #pedidoTable th:nth-child(2), #pedidoTable td:nth-child(2){ width: 16%; text-align:center; }
    #pedidoTable th:nth-child(3), #pedidoTable td:nth-child(3){ width: 16%; text-align:right; }
    #pedidoTable th:nth-child(4), #pedidoTable td:nth-child(4){ width: 16%; }

    .btn-delete{
      background-color: var(--brand-red);
      padding: 10px 10px;
      width: 100%;
      white-space: nowrap;
    }

    #pedido-peso-total{
      padding: 10px 16px 0;
      font-weight: 800;
      color: #0b4f6b;
      text-align: right;
    }

    #btnEnviarPedido{
      width: calc(100% - 32px);
      margin: 14px 16px 16px;
      padding: 14px 12px;
      font-size: 18px;
      font-weight: 900;
      background-color: var(--brand-green);
      border-radius: 14px;
    }

    #pedido-error{
      color: #b91c1c;
      margin: 0 16px 14px;
      text-align: center;
      font-weight: 800;
      min-height: 20px;
    }

    .error-message{
      text-align: center;
      color: #b91c1c;
      font-weight: 800;
      padding: 16px;
      background-color: #fee2e2;
      border: 1px solid #f87171;
      border-radius: 14px;
      margin-top: 14px;
    }

    @media (max-width: 900px){
      .main-content{ flex-direction: column; }
      #pedido-container{ position: static; width: 100%; flex: 1; }
      #pedidoTable{ table-layout: auto; }
      #pedidoTable th, #pedidoTable td{ overflow: visible; text-overflow: clip; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="brand-header">
      <!-- ✅ NUEVO LOGO (Drive thumbnail + grande) -->
      <img
        src="https://drive.google.com/thumbnail?id=1W3UNB4roz2wVRlaMjLv5aQqU67GP-GQU&sz=w1000"
        alt="Telas Real"
      />
      <h1>📦 Inventario de Productos</h1>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Buscar por nombre..." />
      <select id="categoryFilter">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <div class="main-content">
      <div class="inventory-section card">
        <div class="card-header">📦 Inventario</div>

        <table id="inventoryTable">
          <thead>
            <tr>
              <th style="width:90px;">ID</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th style="width:90px;">Stock</th>
              <th style="width:120px;">Cantidad</th>
              <th style="width:110px;">Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div id="error-container" style="padding: 0 16px 16px;"></div>
      </div>

      <div id="pedido-container" class="card">
        <div class="card-header">🛒 Resumen del Pedido</div>

        <div class="controls-pedido">
          <select id="Usuario">
            <option value="">Selecciona tienda (requerido)</option>
            <option value="B2B">B2B</option>
            <option value="Tienda 1">Tienda 1</option>
            <option value="Tienda 2">Tienda 2</option>
            <option value="Tienda 3">Tienda 3</option>
            <option value="Tienda 4">Tienda 4</option>
            <option value="Tienda 5">Tienda 5</option>
            <option value="Tienda 6">Tienda 6</option>
            <option value="Tienda 7">Tienda 7</option>
            <option value="Tienda 8">Tienda 8</option>
            <option value="Tienda 9">Tienda 9</option>
            <option value="Tienda 10">Tienda 10</option>
            <option value="Tienda 11">Tienda 11</option>
            <option value="Tienda 12">Tienda 12</option>
          </select>
        </div>

        <div class="controls-pedido">
          <input type="text" id="Observaciones" placeholder="Observaciones (opcional)" />
        </div>

        <div style="padding: 0 16px 16px;">
          <table id="pedidoTable">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Peso (kg)</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="pedidoTbody"></tbody>
          </table>
        </div>

        <div id="pedido-peso-total">Peso total: 0 kg</div>
        <button id="btnEnviarPedido" onclick="enviarPedidoCompleto()">Confirmar y Enviar Pedido</button>
        <div id="pedido-error"></div>
      </div>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7mTC4BJJYYII93XSRMi3apKZ1H7kl5vG7MvFnPTLN2kiyFBI5CYNBNdFGtsHpiKQkWg/exec";
  const KG_PER_ROLLO = 25;

  let productos = [];
  let pedidoActual = [];

  const tbody = document.querySelector("#inventoryTable tbody");
  const errorContainer = document.getElementById("error-container");

  async function cargarInventario() {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Cargando inventario...</td></tr>';
    try {
      const res = await fetch(SCRIPT_URL);
      if (!res.ok) throw new Error(`Error en la red: ${res.status}`);
      productos = await res.json();
      if (productos.error) throw new Error(`Error del script: ${productos.error}`);

      mostrarProductos(productos);
      llenarCategorias(productos);
      errorContainer.innerHTML = '';
    } catch (error) {
      console.error('Error al cargar el inventario:', error);
      tbody.innerHTML = '';
      errorContainer.innerHTML =
        `<div class="error-message"><strong>Error al Cargar los Datos.</strong><br>
          <small>Detalle: ${error.message}</small></div>`;
    }
  }

  function mostrarProductos(lista) {
    tbody.innerHTML = "";
    const listaConStock = lista.filter(p => Number(p.stock) > 0);

    if (listaConStock.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No se encontraron productos con stock.</td></tr>';
      return;
    }

    listaConStock.forEach(p => {
      const fila = document.createElement("tr");
      const enPedido = pedidoActual.find(item => item.id.toString() === p.id.toString());
      const cantidadEnPedido = enPedido ? enPedido.cantidad : 1;

      fila.innerHTML = `
        <td>${p.id}</td>
        <td>${p.nombre}</td>
        <td>${p.categoria || "N/A"}</td>
        <td>${p.stock}</td>
        <td><input class="qty-input" type="number" min="1" max="${p.stock}" value="${cantidadEnPedido}" id="qty-${p.id}"></td>
        <td><button onclick="agregarAlPedido('${p.id}')">Agregar</button></td>
      `;
      tbody.appendChild(fila);
    });
  }

  function llenarCategorias(lista) {
    const listaConStock = lista.filter(p => Number(p.stock) > 0);
    const categorias = [...new Set(listaConStock.map(p => p.categoria).filter(Boolean))];
    const select = document.getElementById("categoryFilter");
    select.innerHTML = '<option value="">Todas las categorías</option>';
    categorias.sort().forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  function filtrar() {
    const texto = document.getElementById("searchInput").value.toLowerCase();
    const categoria = document.getElementById("categoryFilter").value;

    const filtrados = productos
      .filter(p => Number(p.stock) > 0)
      .filter(p => p.nombre.toLowerCase().includes(texto) && (!categoria || p.categoria === categoria));

    mostrarProductos(filtrados);
  }

  document.getElementById("searchInput").addEventListener("input", filtrar);
  document.getElementById("categoryFilter").addEventListener("change", filtrar);

  function agregarAlPedido(id) {
    const producto = productos.find(p => p.id.toString() === id.toString());
    if (!producto || Number(producto.stock) <= 0) {
      alert("Este producto no tiene stock disponible.");
      return;
    }

    const cantidadInput = document.getElementById(`qty-${id}`);
    const cantidad = parseInt(cantidadInput.value);

    if (isNaN(cantidad) || cantidad <= 0 || cantidad > producto.stock) {
      alert("Cantidad inválida. Debe ser entre 1 y " + producto.stock);
      cantidadInput.value = 1;
      return;
    }

    const itemExistente = pedidoActual.find(item => item.id.toString() === id.toString());
    if (itemExistente) itemExistente.cantidad = cantidad;
    else pedidoActual.push({ id: producto.id, nombre: producto.nombre, cantidad });

    mostrarPedido();
  }

  function formatearKg(valor) {
    return Number.isInteger(valor) ? `${valor} kg` : `${valor.toFixed(2)} kg`;
  }

  function mostrarPedido() {
    const pedidoTbody = document.getElementById("pedidoTbody");
    const btnEnviar = document.getElementById("btnEnviarPedido");
    const pesoTotalDiv = document.getElementById("pedido-peso-total");

    pedidoTbody.innerHTML = "";
    let pesoTotal = 0;

    if (pedidoActual.length === 0) {
      pedidoTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Tu pedido está vacío.</td></tr>';
      btnEnviar.disabled = true;
      pesoTotalDiv.textContent = "Peso total: 0 kg";
      return;
    }

    pedidoActual.forEach(item => {
      const pesoItem = item.cantidad * KG_PER_ROLLO;
      pesoTotal += pesoItem;

      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${item.nombre}</td>
        <td style="text-align:center;">${item.cantidad}</td>
        <td style="text-align:right;">${formatearKg(pesoItem)}</td>
        <td><button class="btn-delete" onclick="borrarDelPedido('${item.id}')">Borrar</button></td>
      `;
      pedidoTbody.appendChild(fila);
    });

    btnEnviar.disabled = false;
    pesoTotalDiv.textContent = `Peso total: ${formatearKg(pesoTotal)}`;
  }

  function borrarDelPedido(id) {
    pedidoActual = pedidoActual.filter(item => item.id.toString() !== id.toString());
    mostrarPedido();
  }

  async function enviarPedidoCompleto() {
    const Usuario = document.getElementById("Usuario").value.trim();
    const Observaciones = document.getElementById("Observaciones").value.trim();
    const pedidoError = document.getElementById("pedido-error");
    pedidoError.textContent = "";

    if (!Usuario) return (pedidoError.textContent = "Por favor, selecciona una tienda.");
    if (pedidoActual.length === 0) return (pedidoError.textContent = "Tu pedido está vacío.");

    const btnEnviar = document.getElementById("btnEnviarPedido");
    btnEnviar.disabled = true;
    btnEnviar.textContent = "Procesando...";

    const itemsParaEnviar = pedidoActual.map(({ id, cantidad }) => ({ id, quantity: cantidad }));

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "submitOrder", Usuario, Observaciones, items: itemsParaEnviar })
      });

      const texto = await res.text();
      if (texto === "OK") {
        alert("¡Pedido enviado con éxito!");
        pedidoActual = [];
        document.getElementById("Usuario").value = "";
        document.getElementById("Observaciones").value = "";
        mostrarPedido();
        await cargarInventario();
      } else {
        let errorData = {};
        try { errorData = JSON.parse(texto); } catch (_) {}
        pedidoError.textContent = `Error del servidor: ${errorData.message || texto || "Error desconocido"}`;
      }
    } catch (error) {
      pedidoError.textContent = "Error de conexión. Inténtalo de nuevo.";
    } finally {
      if (pedidoActual.length > 0) btnEnviar.disabled = false;
      btnEnviar.textContent = "Confirmar y Enviar Pedido";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    cargarInventario();
    mostrarPedido();
  });
</script>
</body>
</html>
